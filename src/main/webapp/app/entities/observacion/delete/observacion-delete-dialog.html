@if (observacion) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(observacion.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="observacionDeleteDialogHeading" jhiTranslate="entity.delete.title">
        Confirmar operación de borrado
      </h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p id="jhi-delete-observacion-heading" jhiTranslate="sgpgApp.observacion.delete.question" [translateValues]="{ id: observacion.id }">
        ¿Seguro que quiere eliminar Observacion {{ observacion.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
      </button>

      <button id="jhi-confirm-delete-observacion" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Eliminar</span>
      </button>
    </div>
  </form>
}
